<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Mesh Module Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        #video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }
        #output {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Face Mesh Detector - Module Example</h1>
        <p>This example shows how to use the FaceMeshDetector module in your project.</p>
        
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="output"></canvas>
        </div>
        
        <div style="text-align: center;">
            <button id="startBtn">Start Detection</button>
            <button id="stopBtn" disabled>Stop Detection</button>
        </div>
        
        <div id="status"></div>
    </div>
    
    <!-- MediaPipe Scripts (required) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <!-- Face Mesh Module -->
    <script src="faceMeshModule.js"></script>
    
    <!-- Your Application Code -->
    <script>
        // Initialize the detector with custom options
        const detector = new FaceMeshDetector({
            videoId: 'video',
            canvasId: 'output',
            startBtnId: 'startBtn',
            stopBtnId: 'stopBtn',
            // Optional: customize animation
            dotAppearDuration: 800,
            lineAppearDuration: 1000,
            color: 'rgba(255, 255, 255, 0.7)',
            // Optional: callbacks
            onFaceDetected: (landmarks) => {
                document.getElementById('status').textContent = 'Face detected!';
                console.log('Face detected with', landmarks.length, 'landmarks');
            },
            onFaceLost: () => {
                document.getElementById('status').textContent = 'Face lost.';
            }
        });
        
        // You can also update settings dynamically:
        // detector.updateSettings({
        //     dotAppearDuration: 500,
        //     color: 'rgba(0, 255, 0, 0.8)'
        // });
        
        // Cleanup when page unloads (optional)
        window.addEventListener('beforeunload', () => {
            detector.destroy();
        });
    </script>
</body>
</html>
